name: 📌 Pinterest Token Auto-Refresher

on:
  schedule:
    # Berjalan 2 kali sehari: 04:00 UTC (12:00 PM MYT) & 16:00 UTC (12:00 AM MYT)
    - cron: '0 4,16 * * *'
  workflow_dispatch:

jobs:
  refresh-token:
    name: 🔄 Refresh & Sync Pinterest Tokens
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Kod Repositori
        uses: actions/checkout@v7

      - name: 🐍 Sediakan Persekitaran Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Pasang Keperluan Pakej (Dependencies)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install requests python-dotenv

      - name: 🔄 Jalankan Enjin Auto-Refresh Token
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
        run: |
          python bin/run_pinterest_token_refresh.py